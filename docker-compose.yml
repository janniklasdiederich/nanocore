services:
  nanocore:
    build: .
    ports:
      - "3001:3001"
    environment:
      PORT: "3001"
      HOST: "0.0.0.0"
      DATA_DIR: /data
      NODE_ENV: production
      # Required: app will refuse to start with a weak/default secret
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      # Comma-separated UI origins if the SPA is not same-origin, e.g. https://boards.example.com
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-15728640}
    volumes:
      - nanocore-data:/data
    restart: unless-stopped

volumes:
  nanocore-data:
